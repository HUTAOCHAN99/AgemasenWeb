<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin · Agemasen Bot</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap"><link rel="stylesheet" href="/style.css"></head><body>
<nav class="wrap"><b><a href="/">Agemasen</a></b><a href="/home" >Command</a><a href="/admin" aria-current="page">Admin</a></nav>
<main class="wrap">
<section id="login" class="panel" hidden style="max-width:380px;margin:40px auto"><h2>Masuk admin</h2>
<p class="muted">Masukkan password untuk melihat statistik bot.</p>
<label for="pw" class="muted">Password</label><input id="pw" type="password" autocomplete="current-password">
<p id="err" class="err" role="alert"></p><button class="btn" id="go">Masuk</button></section>
<section id="dash" hidden>
<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h1 style="font-size:2rem;margin:0">Statistik bot</h1><button class="btn ghost" id="out">Keluar</button></div>
<p class="muted" id="sub">Data 7 hari terakhir.</p>
<div class="kpis" id="kpis"></div>
<div class="grid2"><div class="panel"><h2>Command per hari</h2><div class="bars" id="bars"></div></div>
<div class="panel"><h2>Command terpopuler</h2><table class="tbl" id="top"></table></div></div></section></main>
<script>
const $=id=>document.getElementById(id);
async function load(){
  const r=await fetch("/api/stats");
  if(r.status===401){$("dash").hidden=true;$("login").hidden=false;return}
  const d=await r.json();$("login").hidden=true;$("dash").hidden=false;
  if(!r.ok){$("sub").textContent=d.error;return}
  const k=[["Hari ini",d.today],["7 hari",d.week],["Grup aktif",d.groups],["Error",d.week?Math.round(d.errors/d.week*100)+"%":"0%"],["Rata-rata",d.avgMs+" ms"]];
  $("kpis").innerHTML=k.map(([l,v])=>'<div class="kpi"><b>'+v+'</b>'+l+'</div>').join("");
  const max=Math.max(1,...d.daily.map(x=>x.n));
  $("bars").innerHTML=d.daily.map(x=>'<i title="'+x.d+': '+x.n+'" style="height:'+Math.round(x.n/max*100)+'%"></i>').join("");
  $("top").innerHTML='<tr><th>Command</th><th>Dipakai</th><th>Error</th></tr>'+d.top.map(t=>'<tr><td><code>'+t.command.replace(/</g,"&lt;")+'</code></td><td>'+t.n+'</td><td>'+t.err+'</td></tr>').join("");
}
async function login(){
  $("err").textContent="";
  const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("pw").value})});
  if(r.ok){$("pw").value="";load()}else{$("err").textContent=(await r.json()).error}
}
$("go").onclick=login;$("pw").onkeydown=e=>e.key==="Enter"&&login();
$("out").onclick=async()=>{await fetch("/api/logout");location.reload()};
load();
</script></body></html>
